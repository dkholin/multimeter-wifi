<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Multimeter Wi-Fi</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1210;color:#e6f4eb;font:16px system-ui,sans-serif}.panel{max-width:900px;margin:auto;min-height:100vh;padding:18px 20px}
header{display:flex;justify-content:space-between;align-items:center;letter-spacing:.12em;color:#8fa898;font-size:.75rem}.live{display:flex;align-items:center;gap:.7rem}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#7e8b82;margin-right:6px}.on{background:#59db86;box-shadow:0 0 10px #59db86}
.bat{display:none;vertical-align:middle}.bat.show{display:inline-block}.bat rect.seg{fill:#59db86}.bat rect.seg.off{fill:#26362d}.bat.low rect.seg{fill:#f0c85a}.bat.empty rect.seg{fill:#e06c6c}.bat .shell{fill:none;stroke:#8fa898;stroke-width:1.5}.bat .cap{fill:#8fa898}
.lcd{margin:6vh 0 1rem;padding:1.2rem 1rem 1rem;border:1px solid #26362d;border-radius:14px;background:#111a15}
.tags{display:flex;gap:.5rem;min-height:1.6rem;flex-wrap:wrap}.tags.fn{justify-content:center;border-top:1px solid #1f2d25;padding-top:.8rem}.tag{font-size:.85rem;font-weight:600;letter-spacing:.08em;color:#33453a;padding:.15rem .55rem;border-radius:6px}.tag.on{color:#0d1210;background:#7ee39b;box-shadow:none}.tag.warn.on{background:#f0c85a}.tag[hidden]{display:none}
.read{display:flex;align-items:baseline;justify-content:center;gap:.6rem;margin:1.5rem 0 1rem;flex-wrap:nowrap}.number{font:clamp(3.6rem,16vw,9rem) ui-monospace,monospace;letter-spacing:-.06em;line-height:1;color:#d8ffd6;white-space:nowrap}.number.ol{color:#f0c85a}.number.stale{opacity:.35}
.unit{font-size:clamp(1.6rem,6vw,3.6rem);color:#7ee39b;min-width:2.2em;white-space:nowrap}.unit.q{color:#5f7268;font-size:1.1rem}
.chart{position:relative;height:150px;margin-top:1.4rem;padding:8px 0 20px 64px}.chart svg{width:100%;height:100%;display:block;border-left:1px solid #2c3f33;border-bottom:1px solid #2c3f33}.chart polyline{fill:none;stroke:#64db8b;stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.stats{display:flex;gap:1rem;justify-content:space-between;margin-top:1rem;color:#829087;font-size:.7rem;letter-spacing:.1em}.stats b{display:block;color:#d8ffd6;font:1.1rem ui-monospace,monospace;letter-spacing:0;margin-top:.2rem}.rec{display:flex;gap:.6rem;align-items:center;margin-top:1.2rem}.rec button{background:#16231b;color:#cfe8d6;border:1px solid #33493b;border-radius:8px;padding:.45rem .9rem;font:600 .8rem system-ui;letter-spacing:.08em;cursor:pointer}.rec button:disabled{opacity:.35;cursor:default}.rec button.on{background:#5a1f1f;border-color:#c55;color:#fff}#rinfo{color:#829087;font:.85rem ui-monospace,monospace}.wins{display:flex;justify-content:flex-end;gap:.4rem;margin-top:1rem}.wins button{background:none;color:#829087;border:1px solid #2c3f33;border-radius:6px;padding:.2rem .6rem;font:.72rem system-ui;cursor:pointer}.wins button.on{color:#0d1210;background:#7ee39b;border-color:#7ee39b}.y{white-space:nowrap;position:absolute;left:0;width:58px;text-align:right;color:#829087;font-size:.7rem}.y.t{top:4px}.y.b{bottom:16px}.x{position:absolute;left:64px;right:0;bottom:0;display:flex;justify-content:space-between;color:#829087;font-size:.7rem}
</style></head><body><main class=panel><header><span id=ident>MULTIMETER</span><span class=live><svg id=bat class=bat width=26 height=12 viewBox="0 0 26 12"><rect class=shell x=.75 y=.75 width=21 height=10.5 rx=2></rect><rect class=cap x=22.5 y=3.5 width=2.5 height=5 rx=.8></rect><rect class=seg x=2.5 y=2.5 width=3 height=7></rect><rect class=seg x=6.1 y=2.5 width=3 height=7></rect><rect class=seg x=9.7 y=2.5 width=3 height=7></rect><rect class=seg x=13.3 y=2.5 width=3 height=7></rect><rect class=seg x=16.9 y=2.5 width=3 height=7></rect></svg><span><i id=dot class=dot></i><span id=status>CONNECTING</span></span></span></header>
<section class=lcd><div class=tags><span id=fn class=tag>—</span></div><div class=read><span id=number class=number>—</span><span id=unit class=unit></span></div><div class="tags fn"><span id=auto class=tag hidden>AUTO</span><span id=hold class="tag warn" hidden>HOLD</span><span id=max class=tag hidden>MAX</span><span id=min class=tag hidden>MIN</span><span id=rel class=tag hidden>REL</span><span id=hv class="tag warn" hidden>HV</span><span id=lowbat class="tag warn" hidden>LOW BAT</span></div></section>
<div class=wins><button data-w=30>30 s</button><button data-w=120 class=on>2 min</button><button data-w=600>10 min</button></div><div class=chart><span id=hi class="y t"></span><span id=lo class="y b"></span><svg viewBox="0 0 100 100" preserveAspectRatio=none><polyline id=line points=""/></svg><div class=x><span id=span>—</span><span>now</span></div></div>
<div class=stats><div>MIN<b id=smin>—</b></div><div>MAX<b id=smax>—</b></div><div>AVG<b id=savg>—</b></div><div>SAMPLES<b id=sn>—</b></div></div><div class=rec><button id=rb>● RECORD</button><button id=dl disabled>CSV</button><span id=rinfo></span></div></main><script>
const $=id=>document.getElementById(id),P={M:1e6,k:1e3,m:1e-3,'µ':1e-6,n:1e-9},MAX=700;let h=[],key='',last=0;
/* Transport: ?topic=X or *.github.io -> public relay (ntfy); otherwise the meter's own /ws. */
const DEFAULT_TOPIC="multimeter-wifi-dkholin-7c1b9f2d",qs=new URLSearchParams(location.search),relayTopic=qs.get('topic')||(/github\.io$/.test(location.hostname)?DEFAULT_TOPIC:null);
function eng(v,u){if(v==null)return'';let a=Math.abs(v),s=a>=1e6?[1e6,'M']:a>=1e3?[1e3,'k']:a>=1||a===0?[1,'']:a>=1e-3?[1e-3,'m']:a>=1e-6?[1e-6,'µ']:[1e-9,'n'];return +(v/s[0]).toPrecision(4)+' '+s[1]+u}
function stats(v,u){let sum=v.reduce((x,y)=>x+y,0);$('smin').textContent=eng(Math.min(...v),u);$('smax').textContent=eng(Math.max(...v),u);$('savg').textContent=eng(sum/v.length,u);$('sn').textContent=v.length}
let rec=null,t0r=0,rows=[];
function rinfo(){$('rinfo').textContent=rec?fmtT(Date.now()-t0r)+' · '+rows.length+' samples':rows.length?'stopped · '+rows.length+' samples':''}
function fmtT(ms){let t=Math.floor(ms/1000);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
$('rb').onclick=()=>{if(rec){rec=null;$('rb').classList.remove('on');$('rb').textContent='● RECORD';$('dl').disabled=!rows.length}else{rows=[];rec=1;t0r=Date.now();if(cur)logRow(cur);$('rb').classList.add('on');$('rb').textContent='■ STOP';$('dl').disabled=true}rinfo()};
$('dl').onclick=()=>{let c='elapsed_s,iso_time,value_si,display,unit,prefix,mode\n'+rows.map(r=>r.join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='meter-'+new Date(t0r).toISOString().slice(0,19).replace(/[:T]/g,'-')+'.csv';a.click()};
let cur=null;function stale(){return !last||Date.now()-last>15000}
setInterval(()=>{if(last&&stale()&&$('status').textContent==='LIVE'){$('dot').className='dot';$('status').textContent='OFFLINE';$('number').classList.add('stale')}if(stale())return;if(rec){if(cur)logRow(cur);rinfo()}if(cur)graph(cur)},1000);
function logRow(s){if(!rec||s.hold)return;let v=s.value==null?'':s.value*(P[s.prefix]||1);rows.push([((Date.now()-t0r)/1000).toFixed(2),new Date().toISOString(),v,s.display||'',s.unit||'',s.prefix||'',s.mode||[s.diode?'diode':s.continuity?'continuity':s.ac?'AC':s.dc?'DC':''].join('')]);rinfo()}
let W=120;
function graph(s){if(s.hold)return;let u=s.unit||'',k=u+'|'+(s.mode||''),now=Date.now();if(k!==key){key=k;h=[]}
 if(!h.length||now-h[h.length-1][0]>900){let v=(s.value==null||!s.unit)?null:s.value*(P[s.prefix]||1);h.push([now,v]);if(h.length>MAX)h.shift()}
 render(u)}
function render(u){let now=Date.now(),lo=now-W*1000,w=h.filter(p=>p[0]>=lo),vs=w.map(p=>p[1]).filter(x=>x!=null);
 $('span').textContent='-'+(W>=60?W/60+' min':W+' s');if(!vs.length){$('line').setAttribute('points','');$('hi').textContent=$('lo').textContent='';return}
 let a=Math.min(...vs),b=Math.max(...vs);if(a===b){a-=Math.abs(a)*.05||1;b+=Math.abs(b)*.05||1}
 let pts=[];w.forEach(p=>{if(p[1]!=null)pts.push(((p[0]-lo)*100/(W*1000)).toFixed(2)+','+(95-(p[1]-a)*90/(b-a)).toFixed(2))});
 $('line').setAttribute('points',pts.join(' '));stats(vs,u);$('hi').textContent=eng(b,u);$('lo').textContent=eng(a,u)}
document.querySelectorAll('[data-w]').forEach(e=>e.onclick=()=>{W=+e.dataset.w;document.querySelectorAll('[data-w]').forEach(x=>x.classList.toggle('on',x===e));render(key.split('|')[0])});
/* Meter-specific tags: null/absent = unsupported (hidden), false = supported but inactive, true = active. */
const TAGS={auto:'auto',hold:'hold',max:'max',min:'min',rel:'rel',hv:'hv',lowbat:'low_bat'};
function show(s){last=Date.now();$('dot').className='dot on';$('status').textContent='LIVE';let n=$('number');n.className='number'+(s.ol?' ol':'');n.textContent=s.display??(s.ol?'OL':'—');
 let u=$('unit');if(s.unit){u.className='unit';u.textContent=(s.prefix||'')+s.unit}else{u.className='unit q';u.textContent=s.prefix?s.prefix+' ?':''}
 for(let[id,k]of Object.entries(TAGS)){let e=$(id);e.hidden=s[k]==null;e.classList.toggle('on',s[k]===true)}
 let id=s.manufacturer&&s.model?s.manufacturer+' · '+s.model:'CRENOVA · MS8233D'/* older Crenova firmware sends no identity */;$('ident').textContent=id.toUpperCase();document.title=id;
 let b=$('bat');if(s.battery_level==null)b.classList.remove('show');else{let l=Math.max(0,Math.min(5,s.battery_level));b.classList.add('show');b.classList.toggle('low',l<=1&&l>0);b.classList.toggle('empty',l===0);b.querySelectorAll('.seg').forEach((r,i)=>r.classList.toggle('off',i>=l));b.dataset.mv=s.battery_mv??'';b.setAttribute('aria-label','battery level '+l+' of 5')}
 let N={'Ω':'RESISTANCE',F:'CAPACITANCE',Hz:'FREQUENCY','%':'DUTY CYCLE'},f=$('fn');f.textContent=s.function||(s.diode?'DIODE':s.continuity?'CONTINUITY':s.unit==='V'?(s.ac?'AC ':s.dc?'DC ':'')+'VOLTAGE':N[s.unit]||'—');f.classList.toggle('on',f.textContent!=='—');cur=s;graph(s)}
function live(){$('dot').className='dot on';$('status').textContent='LIVE'}
function offline(t){$('dot').className='dot';$('status').textContent=t;$('number').classList.add('stale')}
function go(){let w=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');
 w.onopen=live;w.onmessage=e=>{let s=JSON.parse(e.data);if(s.status)return;show(s)};
 w.onclose=()=>{offline('RECONNECTING');setTimeout(go,1000)}}
function relay(){let base='https://ntfy.sh/'+encodeURIComponent(relayTopic),env=e=>{if(e&&e.event==='message'&&e.message)try{show(JSON.parse(e.message))}catch(x){}};
 fetch(base+'/json?poll=1&since=latest',{cache:'no-store'}).then(r=>r.text()).then(t=>t.trim().split('\n').filter(Boolean).forEach(x=>{try{env(JSON.parse(x))}catch{}})).catch(()=>{}).finally(()=>{let es=new EventSource(base+'/sse?since=latest');es.onopen=live;es.onmessage=e=>{try{env(JSON.parse(e.data))}catch{}};es.onerror=()=>offline('RECONNECTING')})}
relayTopic?relay():go();
</script></body></html>
